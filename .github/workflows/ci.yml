name: CI Verification

on:
  push:
    branches:
      - main
      - refactor/data-contract
  pull_request:
    branches:
      - main
      - refactor/data-contract

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Typecheck, Lint, Test, Integration, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bridge_ci_test
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup CI Postgres Host Mapping
        run: echo "127.0.0.1 postgres" | sudo tee -a /etc/hosts

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint -- .

      - name: Run Unit Tests
        run: npm test

      - name: Run Database Integration Tests (CI)
        run: npm run test:integration:ci
        env:
          INTEGRATION_DATABASE_URL: postgres://postgres:testpassword@postgres:5432/bridge_ci_test

      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build

